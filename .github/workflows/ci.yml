name: Integración Continua UMSSPIRA

on:
  pull_request:
    branches: ["main", "dev", "epic*"]

jobs:
  verificacion-codigo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar ESLint
        run: pnpm lint

      - name: Verificar TypeScript de la API
        run: pnpm --filter api typecheck

      - name: Ejecutar pruebas unitarias
        run: pnpm test

      - name: Ejecutar pruebas de clientes de vacantes
        run: pnpm --filter web test:features

      - name: Compilar aplicaciones y tipos compartidos
        run: pnpm build
