

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
      - db_data:/var/lib/postgresql/data
      - ./supabase/migrations/0001_esquema_principal.sql:/docker-entrypoint-initdb.d/0001_esquema_principal.sql:ro

volumes:
  db_data:
